<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#45d5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#246cff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Letter R -->
  <text
    x="32"
    y="46"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="38"
    text-anchor="middle"
    fill="#03101a"
  >R</text>
  <!-- Rain drops -->
  <rect x="18" y="52" width="2" height="7" rx="1" fill="#03101a" opacity="0.5" transform="rotate(-12 19 55)"/>
  <rect x="29" y="54" width="2" height="6" rx="1" fill="#03101a" opacity="0.4" transform="rotate(-12 30 57)"/>
  <rect x="40" y="52" width="2" height="7" rx="1" fill="#03101a" opacity="0.5" transform="rotate(-12 41 55)"/>
</svg>
